services:
  - type: web
    name: masbate-dlas-free-demo
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm --prefix server ci && npm --prefix client ci && npm --prefix client run build
    startCommand: npm --prefix server run seed && npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DLAS_FREE_DEMO
        value: "true"
      - key: DLAS_DB_PATH
        value: /tmp/dlas-free-demo.sqlite
      - key: TRUST_PROXY
        value: "1"
