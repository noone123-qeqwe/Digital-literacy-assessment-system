name: Ping website

on:
  schedule:
    # Avoid the top of the hour; GitHub schedules are best-effort.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ping
  cancel-in-progress: false

jobs:
  ping:
    if: github.repository == 'noone123-qeqwe/Digital-literacy-assessment-system'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DLAS_SITE_URL: ${{ vars.DLAS_SITE_URL || 'https://masbate-colleges-digital-literacy.onrender.com' }}
    steps:
      - name: Get ping script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: server/scripts
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Ping application health
        run: node server/scripts/ping-site.js
